# ==============================================================================
# Grafana Datasource Auto-Provisioning for Bite Food Delivery Platform
# ==============================================================================
apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    uid: Prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: true
    jsonData:
      timeInterval: 5s
      httpMethod: POST

