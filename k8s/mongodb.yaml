# ==========================================
# 1. MongoDB Database Deployment
# ==========================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongodb
  labels:
    app: mongodb
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mongodb
  template:
    metadata:
      labels:
        app: mongodb
    spec:
      containers:
        - name: mongodb
          # Pin to mongo:7.0 to resolve SERVER-121912 (MongoDB 8.0 kernel 6.19+ incompatibility)
          image: mongo:7.0
          command: ["mongod"]
          args: ["--bind_ip_all", "--wiredTigerCacheSizeGB", "0.25"]
          env:
            - name: GLIBC_TUNABLES
              value: "glibc.pthread.rseq=1"
          ports:
            - containerPort: 27017
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          volumeMounts:
            - name: mongodb-data
              mountPath: /data/db
      volumes:
        - name: mongodb-data
          emptyDir: {}

---
# ==========================================
# 2. MongoDB Service (ClusterIP Internal)
# ==========================================
apiVersion: v1
kind: Service
metadata:
  name: mongodb
spec:
  ports:
    - port: 27017
      targetPort: 27017
  selector:
    app: mongodb
