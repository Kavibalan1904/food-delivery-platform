# ==========================================
# 1. Frontend Deployment (React + Nginx)
# ==========================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  labels:
    app: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: kavibalan1904/swiftbite-frontend:latest
          ports:
            - containerPort: 80

---
# ==========================================
# 2. Frontend Service (LoadBalancer / Public)
# ==========================================
apiVersion: v1
kind: Service
metadata:
  name: frontend
spec:
  type: LoadBalancer
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080
  selector:
    app: frontend
