version: '3.8'

services:
  # 1. Database Service (MongoDB)
  mongodb:
    image: mongo:7.0
    container_name: swiftbite-mongodb
    ports:
      - "27017:27017"
    environment:
      - GLIBC_TUNABLES=glibc.pthread.rseq=1
    volumes:
      - mongo-data:/data/db

  # 2. Backend Microservice (FastAPI + Python)
  backend:
    build: ./backend
    container_name: swiftbite-backend
    ports:
      - "8000:8000"
    environment:
      - MONGODB_URL=mongodb://mongodb:27017
      - DATABASE_NAME=swiftbite
      - JWT_SECRET=swiftbite-secret-key-12345
    depends_on:
      - mongodb

  # 3. Frontend Microservice (React + Nginx)
  frontend:
    build: ./frontend
    container_name: swiftbite-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

  # 4. Metrics & Monitoring Service (Prometheus)
  prometheus:
    image: prom/prometheus:v2.48.0
    container_name: swiftbite-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    depends_on:
      - backend

  # 5. Metrics Visualization & Observability Dashboard (Grafana)
  grafana:
    image: grafana/grafana:10.2.0
    container_name: swiftbite-grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  mongo-data:
  prometheus-data:
  grafana-data:

